
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Voice Studio</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 25px 15px;
      background: #10121a;
      color: white;
      font-family: Arial, sans-serif;
    }
    .container {
      max-width: 600px;
      margin: 35px auto;
      background: #1c2030;
      padding: 25px;
      border-radius: 18px;
    }
    h1 { text-align: center; }
    .sub {
      text-align: center;
      color: #aeb4c5;
      margin-bottom: 30px;
    }
    label {
      display: block;
      margin: 20px 0 9px;
      font-weight: bold;
    }
    select, textarea {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #41475b;
      background: #111522;
      color: white;
      font-size: 16px;
    }
    textarea {
      min-height: 190px;
      resize: vertical;
    }
    button {
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      border: 0;
      border-radius: 10px;
      background: #8065ff;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }
    #status {
      text-align: center;
      color: #b9b4ff;
      margin-top: 15px;
    }
    .count {
      text-align: right;
      color: #aeb4c5;
      font-size: 13px;
      margin-top: 7px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>My Voice Studio</h1>
    <p class="sub">AI Text to Speech Studio</p>

    <label for="voice">Choose Your Voice</label>
    <select id="voice">
      <option value="aman">Aman — Male</option>
      <option value="hf_beta">hf_beta — Female</option>
    </select>

    <label for="script">Your Script</label>
    <textarea id="script"
      maxlength="10000"
      placeholder="Paste your documentary script here..."></textarea>

    <div class="count" id="count">0 / 10,000</div>

    <button onclick="generateAudio()">Generate Audio</button>
    <p id="status">Language will be detected automatically.</p>
  </div>

  <script>
    const script = document.getElementById("script");
    const count = document.getElementById("count");

    script.addEventListener("input", () => {
      count.textContent = script.value.length + " / 10,000";
    });

    function generateAudio() {
      const text = script.value.trim();
      const status = document.getElementById("status");

      if (!text) {
        status.textContent = "Please enter your script first.";
        return;
      }

      status.textContent =
        "Frontend ready. TTS engine will be connected next.";
    }
  </script>
</body>
</html>
