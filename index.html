<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Voice Studio</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 25px 15px;
      background: #10121a;
      color: white;
      font-family: Arial, sans-serif;
    }
    .container {
      max-width: 600px;
      margin: 35px auto;
      background: #1c2030;
      padding: 25px;
      border-radius: 18px;
    }
    h1 { text-align: center; }
    .sub {
      text-align: center;
      color: #aeb4c5;
      margin-bottom: 30px;
    }
    label {
      display: block;
      margin: 20px 0 9px;
      font-weight: bold;
    }
    select, textarea {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #41475b;
      background: #111522;
      color: white;
      font-size: 16px;
    }
    textarea {
      min-height: 190px;
      resize: vertical;
    }
    button {
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      border: 0;
      border-radius: 10px;
      background: #8065ff;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      background: #5a4b9e;
      cursor: not-allowed;
    }
    #status {
      text-align: center;
      color: #b9b4ff;
      margin-top: 25px;
      min-height: 40px;
    }
    .count {
      text-align: right;
      color: #aeb4c5;
      font-size: 13px;
      margin-top: 7px;
    }
    audio {
      width: 100%;
      margin-top: 15px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>My Voice Studio</h1>
    <p class="sub">AI Text to Speech Studio</p>

    <label for="voice">Choose Your Voice</label>
    <select id="voice">
      <option value="hi-IN-MadhurNeural">Hindi - Madhur (Male Voice)</option>
      <option value="hi-IN-SwaraNeural">Hindi - Swara (Female Voice)</option>
    </select>

    <label for="script">Your Script</label>
    <textarea id="script"
      maxlength="10000"
      placeholder="Paste your Nanda Devi or village documentary script here..."></textarea>

    <div class="count" id="count">0 / 10,000</div>

    <button id="generateBtn" onclick="generateAudio()">Generate Audio</button>
    
    <div id="status">Write your script and click generate.</div>
  </div>

  <script>
    const script = document.getElementById("script");
    const count = document.getElementById("count");
    const btn = document.getElementById("generateBtn");

    script.addEventListener("input", () => {
      count.textContent = script.value.length + " / 10,000";
    });

    async function generateAudio() {
      const text = script.value.trim();
      const voice = document.getElementById("voice").value;
      const status = document.getElementById("status");

      if (!text) {
        status.innerHTML = "<span style='color: #ff6b6b;'>Please enter your script first.</span>";
        return;
      }

      // Start loading state
      btn.disabled = true;
      btn.textContent = "Generating... Please wait";
      status.innerHTML = "Connecting to server... ⏳";

      try {
        // Send request to your live Render server
        const response = await fetch("https://my-tts-platform.onrender.com/generate", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            text: text,
            voice: voice
          })
        });

        if (!response.ok) {
          throw new Error("Server error or still warming up.");
        }

        // Get the audio file and create a link
        const blob = await response.blob();
        const audioUrl = URL.createObjectURL(blob);
        
        // Show audio player
        status.innerHTML = `
          <span style='color: #4cd137;'>Audio is ready! 🎉</span><br>
          <audio controls autoplay src="${audioUrl}"></audio>
        `;

      } catch (error) {
        status.innerHTML = `<span style='color: #ff6b6b;'>Error: ${error.message} <br> (If server was sleeping, try again in 30 seconds)</span>`;
      } finally {
        // Reset button state
        btn.disabled = false;
        btn.textContent = "Generate Audio";
      }
    }
  </script>
</body>
</html>
